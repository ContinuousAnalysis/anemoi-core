# Sparse multi-dataset integration config used by metadata-oriented tests.
#
# This keeps sparse coverage in YAML form without reintroducing a separate
# sparse task class or task config. The task remains `Forecaster`; sparse
# behavior is enabled through `task.dataset_time_offsets`.

data:
  timestep: "5m"
  datasets:
    meps:
      forcing: ["forcing_var"]
      diagnostic: []
      target: []
    nordic_radar:
      forcing: ["forcing_var"]
      diagnostic: []
      target: []

task:
  _target_: anemoi.training.tasks.Forecaster
  multistep_input: 1 # derived from len(input_offsets) per dataset
  multistep_output: 1 # derived from len(target_offset)/rollout
  timestep: "5m"
  rollout:
    # fixed 3-step rollout window for this sparse metadata test
    start: 3
    epoch_increment: 0
    maximum: 3
  validation_rollout: 1
  dataset_time_offsets:
    datasets:
      meps:
        input_offsets: [0]
        target_offsets: []
      nordic_radar:
        input_offsets: [0]
        target_offsets: ["5m", "10m", "15m"] # one per rollout step

dataloader:
  pin_memory: false
  prefetch_factor: 2
  debug:
    time_index_mode: auto_sparse
  num_workers:
    training: 0
    validation: 0
    test: 0
  batch_size:
    training: 1
    validation: 1
    test: 1
  training:
    datasets:
      meps:
        dataset_config:
          dataset: meps_source
          frequency: "1h"
        start: 2020-01-01 00:00:00
        end: 2020-01-02 00:00:00
      nordic_radar:
        dataset_config:
          dataset: radar_source
          frequency: "5m"
        start: 2020-01-01 00:00:00
        end: 2020-01-02 00:00:00
  validation:
    datasets: {}
  test:
    datasets: {}

training: {}
